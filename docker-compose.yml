services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: futurefix
      POSTGRES_PASSWORD: futurefix
      POSTGRES_DB: futurefix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
volumes:
  postgres_data: